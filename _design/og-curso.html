<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#fff;
background:radial-gradient(70% 80% at 85% 20%,rgba(0,163,255,.35),transparent 60%),radial-gradient(50% 60% at 10% 100%,rgba(220,38,38,.28),transparent 60%),linear-gradient(135deg,#011638 0%,#0a2456 60%,#0056d2 140%)}
.wrap{position:relative;width:100%;height:100%;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:22px}
.top img.l{height:78px}
.x{font-family:Poppins;font-weight:700;font-size:30px;opacity:.7}
.top img.o{height:84px;border-radius:14px;border:2px solid rgba(255,255,255,.15)}
.tag{display:inline-block;margin-top:6px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);font-size:20px;font-weight:600;letter-spacing:.5px}
h1{font-family:Poppins;font-weight:800;font-size:64px;line-height:1.05;letter-spacing:-1px;margin-top:18px;max-width:900px}
h1 span{color:#38b6ff}
.sub{margin-top:16px;font-size:27px;color:rgba(255,255,255,.82);max-width:880px;line-height:1.3}
.bot{display:flex;align-items:center;justify-content:space-between}
.chips{display:flex;gap:14px}
.chip{padding:12px 18px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:22px;font-weight:600}
.bonus{padding:18px 26px;border-radius:16px;background:#00a3ff;color:#fff;font-family:Poppins;font-weight:700;font-size:28px;box-shadow:0 12px 40px rgba(0,163,255,.45)}
.bonus small{display:block;font-family:Inter;font-weight:500;font-size:18px;opacity:.9}
</style></head><body><div class="wrap">
<div>
<div class="top"><img class="l" src="linkia-full-transparent.png"><span class="x">×</span><img class="o" src="ocampo-racing-logo.jpg"></div>
<div class="tag">CURSO ONLINE · 11 MÓDULOS · 5 HORAS</div>
<h1>Curso Profesional de <span>Diagnóstico Automotriz</span></h1>
<div class="sub">Multímetro · Scanner · Osciloscopio · Diésel · Inmovilizadores · ECU. Grabado en un taller real.</div>
</div>
<div class="bot">
<div class="chips"><div class="chip">$320.000</div><div class="chip">3 cuotas</div><div class="chip">Garantía 7 días</div></div>
<div class="bonus">🎁 3 meses de LINKIA gratis<small>software de gestión para tu taller</small></div>
</div>
</div></body></html>
